description: >
  The libraries the analyzer's ELF is built against and the table of the
  symbols it takes from them. A program that links this component can
  load and run the published analyzer ELF with esp_elf.
license: MIT

dependencies:
  idf:
    version: ">=5.4.2"

  # 0037: moved here from main/idf_component.yml, unchanged. These are
  # the ABI: an ELF built against one set of tags runs on a host linked
  # with the same tags, and not otherwise. PINNED TO TAGS: a moving
  # branch would change underneath a build that worked.
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-drivers-for-m5tab5.git
    version: "v0.5.9"   # 0030: audio_out_monitor_write()
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-graphics-handler-for-m5tab5.git
    version: "v0.2.7"

  # feckless-drivers requires the USB audio class driver by name and does
  # not fetch it (the player vendors a fixed copy). This program never
  # opens a USB device, but audio_out.c links uac.c, so it has to be
  # here. 1.5.0 is the release the player's copy started from.
  espressif/usb_host_uac: "^1.5.0"

  # The FFT. Replaces arduinoFFT. Optimised for the P4 (dsps_fft2r_fc32
  # picks the arp4 assembly when it can). Its windows do not include
  # Hamming, so analyzer.c computes that one itself. On the host side of
  # the ABI, not in the ELF: its assembly is not written to be
  # position-independent.
  espressif/esp-dsp: "^1.8.0"

  # 0037: esp_elf. The host loads with it; the ELF build needs its
  # project_elf() to link.
  espressif/elf_loader: "2.*"
