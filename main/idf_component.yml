dependencies:
  idf:
    version: ">=5.4.2"

  # 0037: the libraries are components/lothesome_abi's, pinned there: the
  # tags are the ELF's ABI, and a launcher that adds that component gets
  # the same ones. A path, not just the components/ directory, because
  # elf/ is a project of its own and does not look there.
  lothesome_abi:
    path: ../components/lothesome_abi
