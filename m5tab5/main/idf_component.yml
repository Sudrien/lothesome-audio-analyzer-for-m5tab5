dependencies:
  idf:
    # u-lothesome-0001: 6.1, as feckless-libs' umode branch requires.
    version: ">=6.1"

  # 0039: the feckless ABI, the list of what the ELF may take from a
  # launcher, and the libraries it exports. 0047: all three from
  # feckless-libs-for-m5tab5, at one tag -- feckless_abi fails the build
  # otherwise. v0.2.0 is feckless-abi v0.2.5 and its pins unchanged: ABI
  # v1, so a launcher on v1 runs this analyzer. 0048: v0.3.0, and with
  # it usb_host_uac -- the USB microphones' class driver, with the Tab5's
  # fixes -- which the drivers pinned from the registry until v0.2.0 and
  # the project names now. No ABI section: the ELF uses the core list
  # only, and runs on any launcher on v1.
  # 0050: v0.8.7, for feckless_libversions below. Between v0.3.0 and
  # v0.8.7 none of these four changed a header; the ABI is v1 still.
  feckless_abi:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_abi
    version: "umode"
  feckless_drivers:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_drivers
    version: "umode"
  feckless_graphics_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_graphics_handler
    version: "umode"
  usb_host_uac:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_uac
    version: "umode"
  # 0050: the licences list (libversions.h), generated when elf/ is
  # configured, in place of cmake/libversions.cmake. A header only.
  feckless_libversions:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_libversions
    version: "umode"

  # u-lothesome-0001: a box. Every feckless pin above is feckless-libs' umode
  # branch, not a tag, while it is tested; the lock records its commit.
  # feckless_box_libc goes into the ELF (feckless_abi_box_elf()); the box
  # itself, feckless_umode and feckless_box_calls, into standalone.c's .bin.
  feckless_box_libc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_box_libc
    version: "umode"
  feckless_umode:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_umode
    version: "umode"
  feckless_box_calls:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_box_calls
    version: "umode"
  # u-lothesome-0002: what feckless_box_calls needs that the analyzer did
  # not: it answers a boxed app's storage calls too (u-feckless-0007), so it
  # requires the storage handler, and that the FatFs and USB mass-storage
  # forks. The analyzer makes no storage call; they are linked, not used.
  feckless_storage_handler:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/feckless_storage_handler
    version: "umode"
  fatfs:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/fatfs
    version: "umode"
  usb_host_msc:
    git: https://github.com/Sudrien/feckless-libs-for-m5tab5.git
    path: components/usb_host_msc
    version: "umode"

  # The FFT. Replaces arduinoFFT. Optimised for the P4 (dsps_fft2r_fc32
  # picks the arp4 assembly when it can). Its windows do not include
  # Hamming, so analyzer.c computes that one itself. 0039: linked into
  # the ELF, so not part of the ABI.
  espressif/esp-dsp: "^1.8.0"
